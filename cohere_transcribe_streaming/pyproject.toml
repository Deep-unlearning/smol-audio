[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "cohere-streaming"
version = "0.1.0"
description = "Smol Audio example: streaming Cohere Transcribe inference and student distillation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.11",
    "transformers==5.14.1",
    "huggingface_hub",
    "safetensors",
    "numpy",
    "soundfile",
    "librosa",
]

[project.optional-dependencies]
train = ["datasets>=4", "accelerate", "jiwer", "tensorboard"]  # train.py and distill_dataset.py
dev = ["pytest"]

[project.scripts]
cohere-stream-file = "stream_file:main"

[project.urls]
Repository = "https://github.com/Deep-unlearning/smol-audio/tree/master/cohere_transcribe_streaming"
Source = "https://github.com/Deep-unlearning/cohere-transcribe-streaming/pull/3"

[tool.setuptools]
py-modules = ["model", "train", "distill_dataset", "stream_file"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
